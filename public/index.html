<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>在线客服</title>
<style>
  :root {
    --primary: #07c160;
    --primary-dark: #06ad56;
    --bg: #ededed;
    --card: #ffffff;
    --text: #191919;
    --text-sub: #888888;
    --border: #e5e5e5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg);
    display: flex; align-items: center; justify-content: center; color: var(--text);
  }
  .phone {
    width: 100%; max-width: 430px; height: 100vh; height: 100dvh;
    background: var(--bg); display: flex; flex-direction: column; overflow: hidden; position: relative;
  }
  .header {
    background: var(--card); padding: 12px 16px; display: flex; align-items: center; gap: 10px;
    border-bottom: 1px solid var(--border); z-index: 10;
  }
  .header .back { width: 24px; height: 24px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
  .avatar {
    width: 42px; height: 42px; border-radius: 50%;
    background: linear-gradient(135deg, #07c160, #3ddb84); color: #fff;
    display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 600;
    position: relative; flex-shrink: 0;
  }
  .avatar .dot { position: absolute; right: 0; bottom: 0; width: 11px; height: 11px; background: #07c160; border: 2px solid #fff; border-radius: 50%; }
  .header .info { flex: 1; min-width: 0; }
  .header .name { font-size: 16px; font-weight: 600; }
  .header .status { font-size: 12px; color: var(--text-sub); margin-top: 2px; }
  .header .more { cursor: pointer; padding: 6px; }

  .chat { flex: 1; overflow-y: auto; padding: 16px 12px; -webkit-overflow-scrolling: touch; }
  .chat::-webkit-scrollbar { width: 0; }
  .time-divider { text-align: center; margin: 12px 0; }
  .time-divider span { background: #d9d9d9; color: #fff; padding: 3px 10px; border-radius: 3px; font-size: 11px; }

  .msg { display: flex; margin-bottom: 14px; animation: fadeUp .25s ease; }
  @keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }
  .msg .a { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; }
  .msg .a.service { background: linear-gradient(135deg, #07c160, #3ddb84); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
  .msg .a.user { background: linear-gradient(135deg, #4facfe, #00f2fe); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 15px; font-weight: 600; }
  .msg .body { max-width: 72%; }
  .msg .bubble { padding: 10px 12px; font-size: 15px; line-height: 1.5; word-break: break-word; }
  .msg .time { font-size: 11px; color: #aaa; margin-top: 4px; }
  .msg.service { flex-direction: row; }
  .msg.service .body { margin-left: 8px; }
  .msg.service .bubble { background: var(--card); border-radius: 4px 14px 14px 14px; }
  .msg.service .time { text-align: left; }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .body { margin-right: 8px; }
  .msg.user .bubble { background: var(--primary); color: #fff; border-radius: 14px 4px 14px 14px; }
  .msg.user .time { text-align: right; }

  .msg .bubble img { max-width: 180px; border-radius: 8px; display: block; }
  .msg .bubble.image { padding: 3px; background: transparent; }

  .quick { background: var(--card); border: 1px solid var(--border); border-radius: 4px 14px 14px 14px; padding: 10px 12px; max-width: 260px; }
  .quick .title { font-size: 13px; color: var(--text-sub); margin-bottom: 8px; }
  .quick .item { display: block; width: 100%; text-align: left; background: #f5f5f5; border: none; border-radius: 6px; padding: 8px 10px; margin-bottom: 6px; font-size: 14px; color: var(--primary-dark); cursor: pointer; }
  .quick .item:last-child { margin-bottom: 0; }
  .quick .item:active { background: #e8e8e8; }

  .typing { display: none; align-items: center; gap: 6px; padding: 4px 16px 12px; }
  .typing .a { width: 30px; height: 30px; border-radius: 50%; background: linear-gradient(135deg, #07c160, #3ddb84); color: #fff; display: flex; align-items: center; justify-content: center; font-size: 13px; font-weight: 600; }
  .typing .dots { display: flex; gap: 4px; }
  .typing .dots span { width: 6px; height: 6px; background: #999; border-radius: 50%; animation: blink 1.2s infinite; }
  .typing .dots span:nth-child(2) { animation-delay: .2s; }
  .typing .dots span:nth-child(3) { animation-delay: .4s; }
  @keyframes blink { 0%, 60%, 100% { opacity: .2; } 30% { opacity: 1; } }

  .footer { background: var(--card); border-top: 1px solid var(--border); padding: 10px 12px; padding-bottom: calc(10px + env(safe-area-inset-bottom)); display: flex; align-items: flex-end; gap: 8px; z-index: 10; }
  .footer .tool { width: 34px; height: 34px; display: flex; align-items: center; justify-content: center; cursor: pointer; flex-shrink: 0; border-radius: 6px; }
  .footer .tool:active { background: #f0f0f0; }
  .footer .tool svg { width: 24px; height: 24px; }
  .footer .input-wrap { flex: 1; background: #f5f5f5; border-radius: 20px; display: flex; align-items: flex-end; padding: 6px 12px; }
  .footer textarea { flex: 1; border: none; outline: none; background: transparent; font-size: 15px; resize: none; max-height: 100px; line-height: 1.4; font-family: inherit; }
  .footer .send { width: 34px; height: 34px; background: var(--primary); color: #fff; border: none; border-radius: 50%; cursor: pointer; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .footer .send:active { background: var(--primary-dark); }
  .footer .send svg { width: 20px; height: 20px; }
  .footer .send:disabled { background: #ccc; }

  .faq-bar { padding: 8px 16px 4px; display: flex; gap: 8px; overflow-x: auto; -webkit-overflow-scrolling: touch; }
  .faq-bar::-webkit-scrollbar { display: none; }
  .faq-bar .chip { white-space: nowrap; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 6px 14px; font-size: 13px; cursor: pointer; color: var(--text); }
  .faq-bar .chip:active { background: #f0f0f0; }

  .toast { position: fixed; left: 50%; bottom: 90px; transform: translateX(-50%); background: rgba(0,0,0,.75); color: #fff; font-size: 13px; padding: 8px 16px; border-radius: 20px; opacity: 0; transition: opacity .3s; pointer-events: none; z-index: 99; }
  .toast.show { opacity: 1; }
</style>
</head>
<body>
  <div class="phone">
    <div class="header">
      <div class="back" onclick="goBack()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2"><path d="M15 18l-6-6 6-6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <div class="avatar">客<span class="dot"></span></div>
      <div class="info">
        <div class="name">在线客服</div>
        <div class="status">在线 · 平均回复 30 秒</div>
      </div>
      <div class="more" onclick="openMenu()">
        <svg viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2" width="22" height="22"><circle cx="12" cy="5" r="1"/><circle cx="12" cy="12" r="1"/><circle cx="12" cy="19" r="1"/></svg>
      </div>
    </div>

    <div class="faq-bar" id="faqBar"></div>
    <div class="chat" id="chat"></div>
    <div class="typing" id="typing">
      <div class="a">客</div>
      <div class="dots"><span></span><span></span><span></span></div>
    </div>

    <div class="footer">
      <div class="tool" onclick="toggleVoice()" title="语音">
        <svg viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2"><path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/><path d="M19 10v2a7 7 0 0 1-14 0v-2" stroke-linecap="round"/><line x1="12" y1="19" x2="12" y2="23" stroke-linecap="round"/><line x1="8" y1="23" x2="16" y2="23" stroke-linecap="round"/></svg>
      </div>
      <div class="input-wrap">
        <textarea id="input" rows="1" placeholder="请输入您的问题…"></textarea>
      </div>
      <div class="tool" onclick="pickImage()" title="图片">
        <svg viewBox="0 0 24 24" fill="none" stroke="#191919" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="3"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <button class="send" id="sendBtn" onclick="sendMessage()" disabled>
        <svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2"><path d="M22 2L11 13" stroke-linecap="round"/><path d="M22 2l-7 20-4-9-9-4 20-7z" stroke-linejoin="round"/></svg>
      </button>
      <input type="file" id="fileInput" accept="image/*" hidden>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const chatEl = document.getElementById('chat');
    const inputEl = document.getElementById('input');
    const sendBtn = document.getElementById('sendBtn');
    const typingEl = document.getElementById('typing');
    const faqBar = document.getElementById('faqBar');

    let sessionId = localStorage.getItem('cs_session');
    if (!sessionId) {
      sessionId = 'u_' + Date.now() + '_' + Math.random().toString(36).slice(2, 8);
      localStorage.setItem('cs_session', sessionId);
    }

    const socket = io();
    const faqs = ['如何申请退款？', '查询物流进度', '商品价格咨询', '转人工客服', '投诉与建议'];

    function formatTime(iso) {
      const d = iso ? new Date(iso) : new Date();
      return String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
    }
    function escapeHtml(s) { const div = document.createElement('div'); div.textContent = s; return div.innerHTML; }
    function scrollToBottom() { chatEl.scrollTop = chatEl.scrollHeight; }
    function toast(msg) {
      const t = document.getElementById('toast');
      t.textContent = msg; t.classList.add('show');
      clearTimeout(t._t); t._t = setTimeout(() => t.classList.remove('show'), 1600);
    }
    function goBack() { history.length > 1 ? history.back() : toast('没有上一页啦～'); }

    function addMessage(from, msg) {
      const type = msg.from === 'service' ? 'service' : 'user';
      const el = document.createElement('div');
      el.className = 'msg ' + type;
      const avatar = document.createElement('div');
      avatar.className = 'a ' + (type === 'service' ? 'service' : 'user');
      avatar.textContent = type === 'service' ? '客' : '我';
      const body = document.createElement('div');
      body.className = 'body';
      const bubble = document.createElement('div');
      bubble.className = 'bubble';

      if (msg.type === 'image') {
        bubble.classList.add('image');
        const img = document.createElement('img');
        img.src = msg.content;
        img.onclick = () => window.open(msg.content);
        bubble.appendChild(img);
      } else {
        bubble.textContent = msg.content;
      }
      const time = document.createElement('div');
      time.className = 'time';
      time.textContent = formatTime(msg.time);
      body.appendChild(bubble); body.appendChild(time);
      el.appendChild(avatar); el.appendChild(body);
      chatEl.appendChild(el);
      scrollToBottom();
    }

    function addQuickCard(questions) {
      const el = document.createElement('div');
      el.className = 'msg service';
      el.innerHTML = `<div class="a service">客</div><div class="body"><div class="quick"><div class="title">您可能想问：</div>${questions.map((q,i)=>`<button class="item" data-q="${i}">${escapeHtml(q)}</button>`).join('')}</div></div>`;
      chatEl.appendChild(el);
      el.querySelectorAll('.item').forEach(btn => btn.addEventListener('click', () => sendMessage(btn.textContent)));
      scrollToBottom();
    }

    function renderFaqBar() {
      faqBar.innerHTML = faqs.map(f => `<button class="chip">${escapeHtml(f)}</button>`).join('');
      faqBar.querySelectorAll('.chip').forEach(chip => chip.addEventListener('click', () => sendMessage(chip.textContent)));
    }

    function sendMessage(text) {
      const val = (text || inputEl.value).trim();
      if (!val) return;
      if (!text) { inputEl.value = ''; autoResize(); updateSendBtn(); }
      socket.emit('message', { sessionId, text: val, type: 'text' });
    }

    function pickImage() { document.getElementById('fileInput').click(); }
    document.getElementById('fileInput').addEventListener('change', function(e) {
      const file = e.target.files[0];
      if (!file) return;
      if (file.size > 4.5 * 1024 * 1024) { toast('图片不能超过 4.5MB'); e.target.value=''; return; }
      const reader = new FileReader();
      reader.onload = ev => {
        socket.emit('message', { sessionId, text: ev.target.result, type: 'image' });
      };
      reader.readAsDataURL(file);
      e.target.value = '';
    });

    function autoResize() { inputEl.style.height = 'auto'; inputEl.style.height = Math.min(inputEl.scrollHeight, 100) + 'px'; }
    function updateSendBtn() { sendBtn.disabled = inputEl.value.trim().length === 0; }
    inputEl.addEventListener('input', () => { autoResize(); updateSendBtn(); });
    inputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); if (!sendBtn.disabled) sendMessage(); } });

    function toggleVoice() { toast('语音功能开发中，可先发文字或图片～'); }
    function openMenu() { addQuickCard(['查看历史订单', '联系人工客服', '留言反馈']); }

    function showTyping() { typingEl.style.display = 'flex'; scrollToBottom(); }
    function hideTyping() { typingEl.style.display = 'none'; }

    socket.on('connect', () => socket.emit('join', { sessionId }));
    socket.on('session', (session) => {
      chatEl.innerHTML = '';
      if (session.messages && session.messages.length) {
        session.messages.forEach(m => addMessage(m.from, m));
      } else {
        addMessage('service', { from: 'service', content: '您好呀～我是您的专属客服，很高兴为您服务！请问有什么可以帮您的？😊', time: new Date().toISOString() });
      }
    });
    socket.on('message', (msg) => {
      if (msg.from !== 'user') hideTyping();
      addMessage(msg.from, msg);
    });

    renderFaqBar();
    inputEl.focus();
  </script>
</body>
</html>
