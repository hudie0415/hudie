<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>客服工作台</title>
<style>
  :root {
    --primary: #07c160;
    --primary-dark: #06ad56;
    --bg: #f0f2f5;
    --card: #ffffff;
    --text: #191919;
    --text-sub: #888888;
    --border: #e5e5e5;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Helvetica Neue", "Microsoft YaHei", sans-serif;
    background: var(--bg); color: var(--text); height: 100vh; display: flex; overflow: hidden;
  }

  /* 登录遮罩 */
  .login-mask {
    position: fixed; inset: 0; background: rgba(0,0,0,.45); z-index: 999;
    display: flex; align-items: center; justify-content: center;
  }
  .login-mask.hidden { display: none; }
  .login-box {
    background: #fff; border-radius: 12px; padding: 28px 24px; width: 90%; max-width: 340px;
    box-shadow: 0 8px 40px rgba(0,0,0,.2);
  }
  .login-box h2 { font-size: 18px; margin-bottom: 6px; }
  .login-box .sub { font-size: 13px; color: var(--text-sub); margin-bottom: 18px; }
  .login-box input {
    width: 100%; border: 1px solid var(--border); border-radius: 8px; padding: 12px;
    font-size: 15px; outline: none; margin-bottom: 14px;
  }
  .login-box input:focus { border-color: var(--primary); }
  .login-box button {
    width: 100%; background: var(--primary); color: #fff; border: none; border-radius: 8px;
    padding: 12px; font-size: 15px; cursor: pointer;
  }
  .login-box .err { color: #ff3b30; font-size: 13px; margin-top: 10px; display: none; }

  /* 侧边栏 */
  .sidebar {
    width: 300px; background: var(--card); border-right: 1px solid var(--border);
    display: flex; flex-direction: column; flex-shrink: 0;
  }
  .sidebar .brand {
    padding: 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; gap: 10px;
  }
  .sidebar .brand .logo { width: 36px; height: 36px; border-radius: 50%; background: linear-gradient(135deg, #07c160, #3ddb84); color: #fff; display: flex; align-items: center; justify-content: center; font-weight: 600; }
  .sidebar .brand h1 { font-size: 16px; font-weight: 600; }
  .sidebar .brand .count { font-size: 12px; color: var(--text-sub); }
  .sidebar .switch-row { padding: 10px 16px; border-bottom: 1px solid var(--border); display: flex; align-items: center; justify-content: space-between; font-size: 13px; color: var(--text-sub); }
  .switch { position: relative; width: 44px; height: 24px; cursor: pointer; }
  .switch input { opacity: 0; width: 0; height: 0; }
  .switch .slider { position: absolute; inset: 0; background: #ccc; border-radius: 24px; transition: .2s; }
  .switch .slider:before { content: ''; position: absolute; width: 20px; height: 20px; left: 2px; top: 2px; background: #fff; border-radius: 50%; transition: .2s; }
  .switch input:checked + .slider { background: var(--primary); }
  .switch input:checked + .slider:before { transform: translateX(20px); }
  .session-list { flex: 1; overflow-y: auto; }
  .session-item { padding: 14px 16px; border-bottom: 1px solid #f5f5f5; cursor: pointer; transition: background .15s; position: relative; }
  .session-item:hover { background: #f7f7f7; }
  .session-item.active { background: #e8f9ef; border-left: 3px solid var(--primary); }
  .session-item .top { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
  .session-item .id { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .time { font-size: 11px; color: #aaa; flex-shrink: 0; margin-left: 8px; }
  .session-item .preview { font-size: 12px; color: var(--text-sub); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .session-item .badge { background: #ff3b30; color: #fff; font-size: 11px; border-radius: 10px; padding: 1px 7px; margin-left: 6px; display: none; }
  .session-item.has-unread .badge { display: inline-block; }
  .empty { padding: 40px 16px; text-align: center; color: #aaa; font-size: 13px; }

  /* 主区域 */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .chat-header { background: var(--card); padding: 14px 20px; border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
  .chat-header h2 { font-size: 16px; font-weight: 600; word-break: break-all; }
  .chat-header .meta { font-size: 12px; color: var(--text-sub); flex-shrink: 0; margin-left: 10px; }
  .chat-body { flex: 1; overflow-y: auto; padding: 20px; }
  .chat-body .empty-chat { text-align: center; color: #aaa; margin-top: 80px; font-size: 14px; }

  .msg { display: flex; margin-bottom: 16px; }
  .msg .avatar { width: 36px; height: 36px; border-radius: 50%; flex-shrink: 0; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 600; color: #fff; }
  .msg .avatar.user { background: linear-gradient(135deg, #4facfe, #00f2fe); }
  .msg .avatar.service { background: linear-gradient(135deg, #07c160, #3ddb84); }
  .msg .content { max-width: 60%; margin-left: 10px; }
  .msg .bubble { padding: 10px 14px; font-size: 14px; line-height: 1.5; word-break: break-word; border-radius: 12px; }
  .msg .bubble img { max-width: 220px; border-radius: 8px; display: block; }
  .msg .time { font-size: 11px; color: #aaa; margin-top: 4px; }
  .msg.user { flex-direction: row; }
  .msg.user .bubble { background: var(--card); border: 1px solid var(--border); border-top-left-radius: 4px; }
  .msg.service { flex-direction: row-reverse; }
  .msg.service .content { margin-left: 0; margin-right: 10px; }
  .msg.service .bubble { background: var(--primary); color: #fff; border-top-right-radius: 4px; }
  .msg.service .time { text-align: right; }

  .chat-input { background: var(--card); padding: 14px 20px; border-top: 1px solid var(--border); display: flex; gap: 10px; align-items: flex-end; }
  .chat-input textarea { flex: 1; border: 1px solid var(--border); border-radius: 8px; padding: 10px 12px; font-size: 14px; resize: none; outline: none; font-family: inherit; line-height: 1.4; }
  .chat-input textarea:focus { border-color: var(--primary); }
  .chat-input button { background: var(--primary); color: #fff; border: none; border-radius: 8px; padding: 10px 20px; cursor: pointer; font-size: 14px; flex-shrink: 0; }
  .chat-input button:hover { background: var(--primary-dark); }
  .chat-input button:disabled { background: #ccc; cursor: not-allowed; }

  @media (max-width: 700px) {
    body { flex-direction: column; }
    .sidebar { width: 100%; height: 40vh; border-right: none; border-bottom: 1px solid var(--border); }
    .main { height: 60vh; }
    .msg .content { max-width: 80%; }
  }
</style>
</head>
<body>
  <div class="login-mask" id="loginMask">
    <div class="login-box">
      <h2>客服登录</h2>
      <div class="sub">请输入客服密码（默认 admin123）</div>
      <input type="password" id="pwdInput" placeholder="客服密码" />
      <button onclick="doLogin()">登录</button>
      <div class="err" id="loginErr">密码错误，请重试</div>
    </div>
  </div>

  <div class="sidebar">
    <div class="brand">
      <div class="logo">客</div>
      <div>
        <h1>客服工作台</h1>
        <div class="count" id="sessionCount">0 个会话</div>
      </div>
    </div>
    <div class="switch-row">
      <span>机器人自动回复</span>
      <label class="switch">
        <input type="checkbox" id="autoReplySwitch" checked>
        <span class="slider"></span>
      </label>
    </div>
    <div class="session-list" id="sessionList"></div>
  </div>

  <div class="main">
    <div class="chat-header">
      <h2 id="chatTitle">请选择一个会话</h2>
      <div class="meta" id="chatMeta"></div>
    </div>
    <div class="chat-body" id="chatBody">
      <div class="empty-chat">← 左侧选择会话开始回复</div>
    </div>
    <div class="chat-input">
      <textarea id="replyInput" rows="1" placeholder="输入回复内容，Enter 发送"></textarea>
      <button id="sendBtn" onclick="sendReply()" disabled>发送</button>
    </div>
  </div>

  <script src="/socket.io/socket.io.js"></script>
  <script>
    const socket = io();
    let currentSession = null;
    let sessions = {};
    let authed = false;

    const loginMask = document.getElementById('loginMask');
    const pwdInput = document.getElementById('pwdInput');
    const loginErr = document.getElementById('loginErr');
    const sessionListEl = document.getElementById('sessionList');
    const sessionCountEl = document.getElementById('sessionCount');
    const chatTitleEl = document.getElementById('chatTitle');
    const chatMetaEl = document.getElementById('chatMeta');
    const chatBodyEl = document.getElementById('chatBody');
    const replyInputEl = document.getElementById('replyInput');
    const sendBtnEl = document.getElementById('sendBtn');
    const autoReplySwitch = document.getElementById('autoReplySwitch');

    function doLogin() {
      const pwd = pwdInput.value.trim();
      if (!pwd) return;
      socket.emit('admin:join', { password: pwd });
    }
    pwdInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

    socket.on('connect', () => {});
    socket.on('admin:auth', (data) => {
      if (data.ok) {
        authed = true;
        loginMask.classList.add('hidden');
        loginErr.style.display = 'none';
      } else {
        loginErr.style.display = 'block';
      }
    });

    function formatTime(iso) {
      const d = iso ? new Date(iso) : new Date();
      const now = new Date();
      const hm = String(d.getHours()).padStart(2, '0') + ':' + String(d.getMinutes()).padStart(2, '0');
      if (d.toDateString() === now.toDateString()) return hm;
      return (d.getMonth() + 1) + '/' + d.getDate() + ' ' + hm;
    }
    function escapeHtml(s) { const div = document.createElement('div'); div.textContent = s; return div.innerHTML; }

    function renderSessionList() {
      const list = Object.values(sessions).sort((a, b) => {
        const ta = a.lastMessage ? new Date(a.lastMessage.time).getTime() : new Date(a.createdAt).getTime();
        const tb = b.lastMessage ? new Date(b.lastMessage.time).getTime() : new Date(b.createdAt).getTime();
        return tb - ta;
      });
      sessionCountEl.textContent = list.length + ' 个会话';
      if (!list.length) {
        sessionListEl.innerHTML = '<div class="empty">暂无会话，等待客户进线…</div>';
        return;
      }
      sessionListEl.innerHTML = list.map(s => {
        const last = s.lastMessage;
        let preview = '无消息';
        if (last) {
          const body = last.type === 'image' ? '[图片]' : last.content;
          preview = (last.from === 'user' ? '客户：' : '客服：') + body;
        }
        const active = currentSession === s.id ? 'active' : '';
        const hasUnread = (s.unread || 0) > 0 ? 'has-unread' : '';
        return `<div class="session-item ${active} ${hasUnread}" data-id="${escapeHtml(s.id)}">
          <div class="top">
            <span class="id">${escapeHtml(s.id)}<span class="badge">${s.unread || 0}</span></span>
            <span class="time">${last ? formatTime(last.time) : formatTime(s.createdAt)}</span>
          </div>
          <div class="preview">${escapeHtml(preview)}</div>
        </div>`;
      }).join('');
      document.querySelectorAll('.session-item').forEach(el => {
        el.addEventListener('click', () => selectSession(el.dataset.id));
      });
    }

    function renderMessages(messages) {
      if (!messages.length) { chatBodyEl.innerHTML = '<div class="empty-chat">暂无消息</div>'; return; }
      chatBodyEl.innerHTML = messages.map(m => {
        const type = m.from === 'user' ? 'user' : 'service';
        const avatar = m.from === 'user' ? '用' : '客';
        let body;
        if (m.type === 'image') body = `<img src="${m.content}" />`;
        else body = escapeHtml(m.content);
        return `<div class="msg ${type}">
          <div class="avatar ${type}">${avatar}</div>
          <div class="content">
            <div class="bubble">${body}</div>
            <div class="time">${formatTime(m.time)}</div>
          </div>
        </div>`;
      }).join('');
      chatBodyEl.scrollTop = chatBodyEl.scrollHeight;
    }

    async function selectSession(id) {
      currentSession = id;
      renderSessionList();
      chatTitleEl.textContent = '客户：' + id;
      sendBtnEl.disabled = false;
      try {
        const res = await fetch('/api/sessions/' + id);
        const session = await res.json();
        chatMetaEl.textContent = '消息数：' + session.messages.length;
        renderMessages(session.messages);
      } catch (e) { console.error(e); }
    }

    function sendReply() {
      const text = replyInputEl.value.trim();
      if (!text || !currentSession) return;
      socket.emit('admin:reply', { sessionId: currentSession, text });
      replyInputEl.value = '';
      autoResize();
    }
    replyInputEl.addEventListener('keydown', e => { if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendReply(); } });
    function autoResize() { replyInputEl.style.height = 'auto'; replyInputEl.style.height = Math.min(replyInputEl.scrollHeight, 100) + 'px'; }
    replyInputEl.addEventListener('input', autoResize);

    autoReplySwitch.addEventListener('change', () => {
      socket.emit('admin:set-auto-reply', { enabled: autoReplySwitch.checked });
    });

    socket.on('session:list', (list) => {
      sessions = {};
      list.forEach(s => sessions[s.id] = s);
      renderSessionList();
    });
    socket.on('auto-reply', (data) => { autoReplySwitch.checked = data.enabled; });
    socket.on('message:new', (data) => {
      const { sessionId, message } = data;
      if (!sessions[sessionId]) {
        sessions[sessionId] = { id: sessionId, createdAt: message.time, messageCount: 0, lastMessage: null, unread: 0 };
      }
      sessions[sessionId].lastMessage = message;
      sessions[sessionId].messageCount = (sessions[sessionId].messageCount || 0) + 1;
      if (message.from === 'user' && currentSession !== sessionId) {
        sessions[sessionId].unread = (sessions[sessionId].unread || 0) + 1;
      }
      renderSessionList();
      if (currentSession === sessionId) {
        fetch('/api/sessions/' + sessionId).then(r => r.json()).then(s => {
          renderMessages(s.messages);
          chatMetaEl.textContent = '消息数：' + s.messages.length;
        });
      }
    });
  </script>
</body>
</html>
